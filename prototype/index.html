<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pal – Lập lịch cho con (bản thử)</title>
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#e4e2dc;
  --accent:#2f6fde;--accent-soft:#e8f0fd;--red:#c62828;--red-soft:#fdecea;--ok:#2e7d32;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161615;--card:#21201e;--ink:#eeece6;--muted:#a19f98;--line:#33312d;--accent:#7aa7ff;--accent-soft:#1f2b44;--red:#ff6b6b;--red-soft:#3a1f1f;--ok:#7bd88f}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:17px;margin:0;flex:1}
header .sub{font-size:12px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px}
.iconbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.view.active{display:block}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--muted)}
nav button.active{color:var(--accent);font-weight:600}
nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:4px;vertical-align:middle}
/* chat */
/* màn Lên kế hoạch: quỹ giờ (trái) + hoạt động (phải) + trò chuyện (dưới) */
.setup{max-width:1200px;margin:0 auto;padding:12px 12px 20px}
.sgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:12px;align-items:start}
.sgrid .wrap{padding:0}
.schat{display:flex;flex-direction:column;height:min(72vh,680px);min-height:420px;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.schead{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;background:var(--card);display:flex;align-items:center;gap:8px}
.schead .muted{font-weight:400;font-size:12px}
.sjump{display:none}
#chatBox,#actWrap,#budgetWrap{scroll-margin-top:52px}
@media (max-width:760px){
  .sgrid{grid-template-columns:1fr}
  #actWrap{order:-1}
  .setup{padding:10px 10px 16px}
  .schat{height:calc(100dvh - 196px);min-height:360px}
  .schead .muted{display:none}
  .sjump{display:flex;gap:6px;position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 8px}
  .sjump button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 0;font-size:13px}
}
/* hoạt động của con */
.acts .aweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 10px}
.acts .aweek div{text-align:center;font-size:11px;border-radius:8px;padding:4px 0;background:var(--bg);color:var(--muted)}
.acts .aweek div.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.aitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.aitem.new{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.aitem .at{display:flex;align-items:center;gap:6px;font-weight:600}
.aitem .at .lb{font-size:11px;font-weight:500;border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--muted)}
.aitem .at .nw{font-size:11px;font-weight:600;color:var(--accent)}
.aitem .ad{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.aitem .ad span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.aitem .am{font-size:12px;color:var(--muted)}
.aitem .ab{display:flex;gap:6px;margin-top:6px}
.aitem .ab button,.acts .addb{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font-size:12px;padding:3px 9px}
.aform{display:grid;gap:6px;margin-top:6px}
.aform input,.aform select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px;min-width:0}
.aform .r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.aform .dpk{display:flex;gap:4px;flex-wrap:wrap}
.aform .dpk button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:4px 8px;font-size:12px}
.aform .dpk button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.aform .row{display:flex;gap:6px;justify-content:flex-end}
.aform .row button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:5px 12px}
.aform .row button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.adirty{font-size:13px;border:1px dashed var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.adirty button{margin-left:6px;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:3px 9px;font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:14px 12px 8px}
.msg{max-width:86%;margin:0 0 10px;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{margin-left:auto;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.pal{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.pal .act{display:flex;gap:6px;margin-top:6px}
.msg.pal .act button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;font-size:12px;padding:2px 8px}
.msg .usage{font-size:11px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.tai{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.tai.cao{background:#fde2e1;color:#a12622}.tai.vua{background:#fff1d6;color:#8a5a00}.tai.thap{background:#e6f2e6;color:#2e6b2e}.tai.phuc_hoi{background:#e3eefc;color:#1f5bb5}
.prof{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px;margin-top:4px}.prof b{color:var(--muted);font-weight:500}
.msg.sys{max-width:100%;text-align:center;font-size:12px;color:var(--muted);background:none;padding:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px;border-top:1px solid var(--line);background:var(--card)}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-family:inherit;font-size:16px;line-height:1.4;background:var(--bg);color:var(--ink);max-height:140px}
.composer button{border:0;border-radius:12px;padding:10px 14px;font-size:15px}
#micBtn,#attBtn{background:var(--accent-soft);color:var(--accent)}
.composer button#attBtn{padding:10px 11px}
#preview{display:none;gap:8px;padding:6px 12px 0;background:var(--card);border-top:1px solid var(--line);overflow-x:auto}
#preview .th{position:relative;flex:none}
#preview img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#preview .th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#333;color:#fff;font-size:12px;padding:0}
.msg img{display:block;max-width:180px;max-height:180px;border-radius:10px;margin-top:6px}
#micBtn.rec{background:var(--red);color:#fff}
#sendBtn{background:var(--accent);color:#fff;font-weight:600}
#sendBtn:disabled{opacity:.5}
.hint{font-size:12px;color:var(--muted);padding:0 14px 6px;background:var(--card)}
/* plan */
.wrap{padding:14px 12px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 6px}
.card ul{margin:4px 0 0 18px;padding:0}
.muted{color:var(--muted);font-size:13px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.day{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 11px;font-size:14px;position:relative}
.day.active{background:var(--accent);border-color:var(--accent);color:#fff}
.day .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.banner{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.banner button{margin-left:auto;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:8px;font-size:12px;padding:3px 8px}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.block .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.block .k{font-weight:600;margin:2px 0}
.block ul{margin:4px 0 0 18px;padding:0;font-size:14px}
.block .x{display:inline-block;margin-top:6px;font-size:12px;border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--muted)}
.block.changed,.block.changed .t,.block.changed .x{color:var(--red)}
.block.changed{border-color:var(--red);background:var(--red-soft)}
.block.cancel .k,.block.cancel ul{text-decoration:line-through}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--red);color:#fff;vertical-align:middle;text-decoration:none;display:inline-block}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.warn{background:#fff6e0;border:1px solid #f0c36d;color:#6b4a00;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px}.warn ul{margin:4px 0 0 18px;padding:0}
@media (prefers-color-scheme:dark){.warn{background:#3a3020;border-color:#7a5c1e;color:#f3d79a}}
.msg .cb{margin-top:8px;background:#fff6e0;color:#6b4a00;border-radius:10px;padding:6px 9px;font-size:13px;white-space:pre-wrap}
@media (prefers-color-scheme:dark){.msg .cb{background:#3a3020;color:#f3d79a}}
.period{border-color:#b9a4f0}.prow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.prow button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px}.prow button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.brow{border-top:1px solid var(--line);padding:10px 0}.brow:first-child{border-top:0}.brow.sub{border-top:0;padding-top:0;margin-left:14px}
.brow .gname{font-weight:600;font-size:15px}.brow.sub .gname{font-weight:500;font-size:13.5px}.brow .gex{font-size:12px;color:var(--muted);margin-top:1px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.clab{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.rng input{width:72px;font-size:15px}
.presetbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.presetbar select{flex:1;min-width:130px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px}
.presetbar button,.newp button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:13px}
.presetbar button.pri,.newp button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.newp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.newp input{flex:1;min-width:150px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px}
.fx{font-size:15px;padding:4px 0}
.wline{font-size:12px;margin-top:4px;line-height:1.35}.wline.cam{color:#b35c00}.wline.do{color:#c62828}.wline.okd{color:var(--muted)}
.wline button{display:inline-block;margin-left:6px;border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:1px 7px;font-size:11.5px}
.bt{width:100%;border-collapse:collapse;font-size:14px}.bt th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:4px 2px}
.bt td{padding:8px 2px;border-top:1px solid var(--line);vertical-align:top}.bt .gname{font-weight:600}.bt .gex{font-size:11.5px;color:var(--muted);margin-top:2px}
.bt .sub td{border-top:0;padding-top:0}.rng{display:flex;align-items:center;gap:3px;white-space:nowrap}
.rng input{width:72px;padding:5px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;text-align:center}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.c-xanh{background:#2e9d4f}.c-cam{background:#ef8a17}.c-do{background:#d93025}.c-xam{background:#b9b6ae}
.act{font-size:11.5px;color:var(--muted);margin-top:3px}.act.out{color:#b35c00}
.sumbar{border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;background:var(--accent-soft)}.sumbar.bad{background:#fde2e1;color:#8c1d18}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.kid h2{font-size:18px}.kblk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.kblk.now{border:2px solid var(--accent)}.kblk.done{opacity:.6}.kblk .t{font-size:13px;color:var(--muted)}.kblk .k{font-size:17px;font-weight:600;margin:2px 0}
.kblk ul{margin:4px 0 0 18px;padding:0;font-size:15px}.kbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kbtns button{border:0;border-radius:12px;padding:9px 14px;font-size:15px;background:var(--accent-soft);color:var(--accent)}
.kbtns button.ok{background:var(--accent);color:#fff}.kbtns .st{font-size:13px;color:var(--muted);padding:9px 0}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:#2e9d4f}
.nowtag{font-size:11px;background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.kfb{margin-top:8px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;white-space:pre-wrap}
.mood{display:flex;gap:8px;margin-top:8px}.mood button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font-size:15px}
.mood button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.doneMark{font-size:12px;color:#2e7d32;margin-left:6px}
.prop{font-size:14px;border-top:1px solid var(--line);padding:8px 0}.prop .prow{margin-top:6px}
.removed{font-size:13px;color:var(--red);margin:0 0 8px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));background:#333;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;display:none;z-index:9}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.dlg .box{background:var(--card);border-radius:14px;padding:16px;max-width:360px}
.dlg .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}.dlg .opts button{text-align:left;padding:10px 12px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dlg button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:7px 12px}
.dlg button.danger{background:var(--red);color:#fff;border-color:var(--red)}
</style>
</head>
<body>
<header>
  <div style="flex:1">
    <h1>Pal · Lịch của con</h1>
    <div class="sub" id="saveState">Bản thử nghiệm</div>
  </div>
  <button class="iconbtn" id="ttsBtn" title="Pal đọc to câu trả lời">🔈 Đọc to</button>
  <button class="iconbtn" id="resetBtn" title="Làm lại để test">↺ Làm lại</button>
</header>
<main>
  <section class="view active" id="setupView"><div class="setup">
   <div class="sjump"><button data-j="actWrap">🧩 Hoạt động</button><button data-j="budgetWrap">⏱️ Quỹ giờ</button><button data-j="chatBox">💬 Trò chuyện</button></div>
   <div class="sgrid"><div class="wrap" id="budgetWrap"></div><div id="actWrap"></div></div>
   <div class="schat" id="chatBox">
    <div class="schead">💬 Trò chuyện với Pal <span class="muted">· kể về con, Pal ghi hoạt động và xếp lịch</span></div>
    <div id="msgs"></div>
    <div class="chips" id="chips"></div>
    <div class="hint" id="hint">Muốn nói thay vì gõ: chạm vào ô nhập, rồi bấm biểu tượng 🎤 trên bàn phím điện thoại.</div>
    <div id="preview"></div>
    <div class="composer">
      <button id="attBtn" title="Đính kèm ảnh">📎</button>
      <input type="file" id="fileIn" accept="image/*" multiple hidden>
      <button id="micBtn" title="Nói">🎤</button>
      <textarea id="input" rows="1" placeholder="Nói hoặc gõ cho Pal…"></textarea>
      <button id="sendBtn">Gửi</button>
    </div>
   </div>
  </div></section>
  <section class="view" id="planView"><div class="wrap" id="planWrap"></div></section>
  <section class="view" id="todayView"><div class="wrap" id="todayWrap"></div><input type="file" id="kidFile" accept="image/*" capture="environment" hidden></section>
</main>
<nav>
  <button class="active" data-view="setupView">🧭 Lên kế hoạch</button>
  <button data-view="planView" id="planTab">🗓️ Lịch tuần</button>
  <button data-view="todayView">🧒 Của con</button>
</nav>
<div class="toast" id="toast"></div>
<div class="dlg" id="ask"><div class="box"><div style="font-weight:600;margin-bottom:6px">Pal nhắc một lần</div><div id="askText" class="muted"></div><div class="opts"><button class="danger" id="askYes">Giữ mức này, bố mẹ đã cân nhắc</button><button id="askNo">Đổi lại</button></div></div></div>
<div class="dlg" id="dlg"><div class="box"><div style="font-weight:600;margin-bottom:6px">Làm lại để test</div><div id="dlgText" class="muted"></div>
<div class="opts"><button id="dlgKeep">Giữ hồ sơ của con, xóa lịch và hội thoại</button><button id="dlgPlan">Chỉ xóa lịch, giữ hồ sơ và hội thoại</button><button class="danger" id="dlgYes">Xóa hết, bắt đầu từ đầu</button><button id="dlgNo">Thôi</button></div></div></div>

<script>
(() => {
const DAYS = ["T2","T3","T4","T5","T6","T7","CN"];
const DAY_NAME = {T2:"Thứ Hai",T3:"Thứ Ba",T4:"Thứ Tư",T5:"Thứ Năm",T6:"Thứ Sáu",T7:"Thứ Bảy",CN:"Chủ Nhật"};
const blank = () => ({profile:{}, plan:{tong_quan:null, ngay:{}, ngoai_le:{}}, changed:{}, removed:{}, messages:[], totals:{calls:0, inTok:0, outTok:0}, budget:null, budgetOk:{}, log:{}, proposals:[], activities:[], actNew:[], actDirty:false, v:1});
let S = blank();
let curDay = "T2", showTemplate = false, busy = false, lastFailed = false;
let db = null, docRef = null, sample = null;
const $ = id => document.getElementById(id);

/* ---------- storage ---------- */
function loadLocal(){ try{ const s = localStorage.getItem("pal-state"); if(s) S = Object.assign(blank(), JSON.parse(s)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem("pal-state", JSON.stringify(S)); }catch(e){} }
let saving = false, saveAgain = false;
async function save(){
  saveLocal();
  if(!docRef){ setStatus("Lưu trên máy này"); return; }
  if(saving){ saveAgain = true; return; }
  saving = true;
  try{ await docRef.set(JSON.parse(JSON.stringify(S))); setStatus("Đã lưu"); }
  catch(e){ setStatus("Chưa lưu được lên máy chủ (đã lưu trên máy này)"); }
  saving = false;
  if(saveAgain){ saveAgain = false; save(); }
}
async function initCaps(){
  try{
    const [d, u, s] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
    sample = s;
    if(!sample){ addSys("Trang này chưa được phép gọi AI. Hãy mở trang trên claude.ai khi đã đăng nhập."); }
    if(d && u){
      const id = await u.id();
      if(id){
        db = d; docRef = db.doc("data/users/" + id + "/state");
        const timer = setTimeout(() => { setStatus("Chưa kết nối được nơi lưu"); }, 10000);
        try{
          const snap = await docRef.get(); clearTimeout(timer);
          if(snap.exists){ S = Object.assign(blank(), JSON.parse(JSON.stringify(snap.data()))); checkPeriodExpiry(); renderAll(); }
          setStatus("Đã đồng bộ");
        }catch(e){ clearTimeout(timer); }
      }
    }
  }catch(e){}
}

function fmtK(n){ return n >= 1000 ? (Math.round(n / 100) / 10).toLocaleString("vi-VN") + "k" : String(Math.round(n)); }
function usageLine(u){ return "≈ vào " + fmtK(u.inTok) + " · ra " + fmtK(u.outTok) + " token (ước tính)" + (u.tools ? " · " + u.tools + " mục cập nhật" : "") + (u.imgs ? ", " + u.imgs + " ảnh" : "") + " · " + u.secs + " giây" + (u.tier ? " · " + u.tier : ""); }
function bubble(role, text, imgs, usage){
  const d = document.createElement("div"); d.className = "msg " + role;
  const body = document.createElement("div"); body.textContent = text; d.appendChild(body);
  (imgs || []).forEach(u => { const im = document.createElement("img"); im.src = u; d.appendChild(im); });
  if(role === "pal"){
    const a = document.createElement("div"); a.className = "act";
    const r = document.createElement("button"); r.textContent = "🔊 Nghe"; r.onclick = () => speak(body.textContent, true);
    a.appendChild(r); d.appendChild(a);
    const ul = document.createElement("div"); ul.className = "usage"; if(usage) ul.textContent = usageLine(usage); d.appendChild(ul); body._usage = ul;
  }
  $("msgs").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight;
  return body;
}
function addSys(t){ const d = document.createElement("div"); d.className = "msg sys"; d.textContent = t; $("msgs").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight; }

const TOOLS = [

   execute: async (inp) => {

     let changedIdx = [], removed = 0;
     if(before.length){
       const oldSigs = new Set(before.map(sig)); const newSigs = new Set(nb.map(sig));
       nb.forEach((b, i) => { if(!oldSigs.has(sig(b))) changedIdx.push(i); });
       removed = Math.max(0, before.filter(b => !newSigs.has(sig(b))).length - changedIdx.length);
     }
     S.changed[d] = changedIdx; if(removed) S.removed[d] = removed; else delete S.removed[d];
     curDay = d; showTemplate = false; renderPlan(); renderDot();
     return "Đã lưu " + DAY_NAME[d] + ": " + nb.length + " khối, " + changedIdx.length + " khối thay đổi" + (removed ? ", bỏ " + removed + " khối" : "") + ".";
   }},
  {name:"xoa_ngoai_le", description:"Bỏ ngoại lệ tuần này của một ngày, quay về lịch mẫu.",
   inputSchema:{type:"object", properties:{ngay:{type:"string", enum:DAYS}}, required:["ngay"]},
   execute: async (inp) => { startChanges(); delete S.plan.ngoai_le[inp.ngay]; S.changed[inp.ngay] = []; renderPlan(); renderDot(); return "Đã quay về lịch mẫu cho " + DAY_NAME[inp.ngay] + "."; }}
];

const RULES = `Bạn là Pal, trợ lý nuôi dạy con của ứng dụng Parent-Pal. Xưng "mình", gọi phụ huynh là "bạn". Tiếng Việt.
NHIỆM VỤ: (1) trò chuyện để hiểu con; (2) lập kế hoạch tổng quan và thời khóa biểu chi tiết cả tuần cho trẻ 6–15 tuổi; (3) sửa kế hoạch khi phụ huynh báo thay đổi.

PHẢN HỒI BÀI LÀM QUA ẢNH (ngoại lệ với quy tắc không gạch đầu dòng):

  Dòng đầu (không gạch): tên sách/trang, số bài. Ví dụ "Toán 3, trang 59 (bài 141–145):"
  - Kết quả: số bài đúng trên tổng số; nêu số bài sai nếu có.
  - Mỗi bài sai một dòng: sai ở bước nào, gợi ý một bước để con tự sửa; KHÔNG viết đáp án đúng.
  - Trình bày: chỗ thiếu đơn vị, ô hoặc gạch ngang chưa điền, phép tính gộp khó nhìn (nêu đúng bài).

THU THẬP THÔNG TIN (hiểu con trước khi xếp lịch):

- Cần hỏi trước khi lập lịch (gộp tối đa 2 câu ngắn một lượt, hỏi bằng lời tự nhiên):
  + Sức khỏe: bệnh nền (hen, dị ứng, tim mạch…), thuốc đang dùng, hay ốm vặt, có hạn chế vận động không.

KHI LẬP KẾ HOẠCH: điền "ho_so", "tong_quan" và "ngay" cho đủ 7 ngày T2, T3, T4, T5, T6, T7, CN (pham_vi="mau_tuan"). "tra_loi" 1–2 câu, mời bạn mở tab Lịch tuần.

NGUYÊN TẮC CÂN BẰNG (ĐẶT CAO HƠN YÊU CẦU CỦA PHỤ HUYNH):
- Pal là người tư vấn, không chỉ làm theo. Trước khi thêm giờ học hoặc hoạt động, tự kiểm tra: (1) giờ ngủ đủ mức tối thiểu theo tuổi; (2) sau giờ học ở trường có khối phục hồi 20–30 phút trước việc học; (3) không có hai khối tải cao liền nhau mà không nghỉ; (4) không có khối học trước giờ đi học buổi sáng (buổi sáng chỉ dành cho vệ sinh, vận động, ăn sáng, chuẩn bị); (5) tổng thời gian học ở nhà do BỐ MẸ quyết định qua quỹ thời gian (hoc_nha), Pal không tự đặt mức trần riêng và không nhận xét con số đó; Pal chỉ lo CÁCH XẾP: chia thành các phiên ngắn theo độ tập trung (phiên liên tục tối đa khoảng 20–30 phút với lớp 1–3, 30–40 phút với lớp 4–5, 40–45 phút với lớp 6–9; giữa hai phiên nghỉ 5–10 phút đứng dậy, uống nước, hoặc đặt hai phiên ở hai buổi khác nhau); ngày có học thêm buổi tối thì hỏi bố mẹ có muốn bớt học ở nhà không; (6) tập luyện mạnh kết thúc trước giờ tắt đèn ít nhất 1 giờ, màn hình giải trí kết thúc trước 60 phút.
- Nếu yêu cầu của phụ huynh phạm một điều trên: KHÔNG tự xếp phương án phạm quy tắc ở lượt này. Trong "tra_loi": nói nhẹ nhàng, không giảng giải, 1 câu lý do cụ thể (ví dụ "thêm 30 phút ngay sau giờ học sẽ thành hai khối học liền nhau, con dễ căng thẳng"), rồi đưa 1–2 phương án cân bằng (thay một phần ôn bài bằng nội dung mới, rút ngắn còn 15–20 phút, chuyển sang sáng cuối tuần, xen kẽ ngày, đổi thành hoạt động học qua chơi) và hỏi bạn chọn cách nào. Ghi lý do vào "canh_bao". Để "ngay": [].

QUỸ THỜI GIAN CỦA GIA ĐÌNH ("quy_thoi_gian" trong trạng thái):
- Bố mẹ đã chọn SỐ PHÚT mỗi ngày cho hoc_nha, sinh_hoat, ngu và mức tối đa man_hinh, riêng ngày đi học và cuối tuần. truong và hoc_them cố định theo lịch đã đăng ký (không tự thêm bớt lớp học thêm). choi_nghi là phần còn lại. Xếp lịch sao cho mỗi nhóm lệch không quá ±30 phút so với số đã chọn (ngủ thì không thấp hơn số đã chọn quá 30 phút và không dưới mức tối thiểu theo tuổi); nếu không xếp vừa thì nói ngắn nhóm nào lệch.

- Các nhóm bố mẹ đã xác nhận vùng đỏ ("da_xac_nhan_vung_do") là lựa chọn của gia đình: KHÔNG cảnh báo lại. Màu cảnh báo chỉ ở bảng quỹ giờ; trong "canh_bao" chỉ nêu lỗi sàn cố định hoặc điều mới.

QUY TẮC LẬP LỊCH:
- Chia ngày thành KHỐI (ví dụ "Dậy và vệ sinh buổi sáng"); mỗi khối gồm vài việc nhỏ trong "viec"; chỉ xác nhận 1 lần cho cả khối. Chọn mức xác nhận nhẹ nhất đủ tin cậy: Tự động (vào/ra vùng địa điểm, buổi tập), Con bấm Xong, Ảnh, Giọng nói, Bố mẹ xác nhận; khối nghỉ/chơi tự do "Không cần". Không kiểm tra trong giờ học.
- Ngủ: 6–12 tuổi 9–12 tiếng; 13–18 tuổi 8–10 tiếng. Tính giờ dậy theo giờ phải có mặt ở trường rồi lùi ra giờ tắt đèn.
- Mỗi khối có nhãn tải "tai": cao (giờ học ở trường, học thêm, ôn môn khó, viết văn, tập luyện có huấn luyện viên hoặc thi đấu), vua (đọc to, học thuộc, soạn cặp, vận động có hướng dẫn), thap (vệ sinh, ăn uống, đọc sách trên giường), phuc_hoi (ăn nhẹ và chơi tự do, nghỉ ngắn, giấc ngủ). Sau khối cao kéo dài luôn có khối phục hồi; không xếp hai khối cao liền nhau; khối cuối trước giờ ngủ là thap.
- VẬN ĐỘNG VUI LÀ GIẢI TRÍ, KHÔNG PHẢI TẢI: bơi chơi, nhảy dây, đạp xe dạo, đá bóng với bạn, chơi công viên giúp con hồi sức và tập trung tốt hơn khi học sau đó. Xếp chúng vào khối phục hồi hoặc thời gian tự do (tai="phuc_hoi"), do con chọn. Chỉ tập luyện có bài bản, cường độ cao hoặc thi đấu mới tính tải; loại này kết thúc ít nhất 1 giờ trước giờ tắt đèn.
- Vận động buổi sáng 15–25 phút (khởi động, phần chính như đạp xe 500–1.000 m hoặc cardio nhẹ, giãn cơ; có phương án trong nhà khi mưa; trẻ dưới 12 tuổi đạp xe ngoài đường có người lớn đi cùng, đội mũ bảo hiểm).
- Vừa về nhà: khối 10 phút "Ghi lại việc được giao và hỏi thăm" (chụp sổ hoặc kể cho Pal; Pal hỏi một câu "Hôm nay con thấy thế nào?" Ổn / Hơi mệt / Rất mệt). Sau đó khối phục hồi 20–30 phút trước ôn bài: ăn nhẹ trước, rồi chơi tự do do con chọn, có thể là vận động vui ngoài trời (nếu tiện thì chỗ có cây); không giao việc, không màn hình. Ghi vào ghi_chu: nếu con báo "Rất mệt" thì kéo dài phục hồi thêm khoảng 15 phút và bỏ phần học theo định hướng bố mẹ hôm đó.

const NOT_HOME = /(ở trường|đi học|tại trường|trung tâm|học thêm|tan học|về nhà|đồng phục|soạn cặp|chuẩn bị)/i;
const SPORT = /(tập|thi đấu|bóng|bơi|võ|chạy|đạp xe|thể thao|gym)/i;
const BED = /(tắt đèn|đi ngủ|^ngủ)/i;
function gradeOf(){ const t = (S.profile && (S.profile.tuoi_lop || "")) + ""; const g = /lớp\s*(\d{1,2})/i.exec(t); if(g) return +g[1]; const a = /(\d{1,2})\s*tuổi/i.exec(t); return a ? Math.max(1, +a[1] - 5) : null; }
function ageOf(){ const t = (S.profile && (S.profile.tuoi_lop || "")) + ""; const a = /(\d{1,2})\s*tuổi/i.exec(t); if(a) return +a[1]; const g = gradeOf(); return g ? g + 5 : null; }
function liveBlocks(d){ return effDayRaw(d).filter(b => b.trang_thai !== "huy" && toMin(b.bat_dau) !== null).map(b => Object.assign({}, b, {s: toMin(b.bat_dau), e: toMin(b.ket_thuc) ?? toMin(b.bat_dau)})).sort((a, b) => a.s - b.s); }
function effDayRaw(d){ return S.plan.ngoai_le[d] ? S.plan.ngoai_le[d].khoi : (S.plan.ngay[d] || []); }
const isStudy = b => (b.tai === "cao" || b.tai === "vua") && STUDY.test(b.khoi + " " + (b.viec || []).join(" ")) && !NOT_HOME.test(b.khoi);
const isSchool = b => /(ở trường|tại trường|học ở trường)/i.test(b.khoi) && (b.e - b.s) >= 150;
function checkDay(d){ return checkDayK(d).filter(w => !relaxed().has(w.k)).map(w => w.t); }

function relaxed(){ const G = S.plan.giai_doan; return new Set(G && G.trang_thai === "dang_ap_dung" ? (G.noi_long || []) : []); }
function checkDayK(d){
  const W = [], B = liveBlocks(d); if(!B.length) return W;
  const push = W.push.bind(W); W.push = (t, k) => push({t, k: k || "khac"});
  const school = B.find(isSchool);
  // (4) học trước giờ đi học
  if(school){ B.filter(b => b.e <= school.s && isStudy(b)).forEach(b => W.push("Có khối học \"" + b.khoi + "\" ngay trước giờ đi học; buổi sáng nên để con vệ sinh, vận động, ăn sáng.", "truoc_gio_hoc")); }
  // (2) phục hồi sau giờ học

    const firstStudy = after.find(isStudy);
    if(firstStudy && !after.some(b => b.tai === "phuc_hoi" && b.s < firstStudy.s)) W.push("Sau giờ học ở trường chưa có khối phục hồi trước \"" + firstStudy.khoi + "\".", "phuc_hoi");
  }

    const a = B[i - 1], b = B[i];
    if(a.tai === "cao" && b.tai === "cao" && b.s - a.e < 5 && !isSchool(a) && !isSchool(b)) W.push("\"" + a.khoi + "\" và \"" + b.khoi + "\" là hai khối tải cao liền nhau, nên chèn nghỉ ngắn.", "cao_lien");
  }
  // (5) tổng giờ học ở nhà
  { const col = (d === "T7" || d === "CN") ? "we" : "wd", lim = getBudget()[col].hoc_nha;
    const total = B.filter(isStudy).reduce((n, b) => n + Math.max(0, b.e - b.s), 0);
    if(total > lim + SOFT) W.push("Tổng giờ học ở nhà khoảng " + total + " phút, vượt quỹ bố mẹ đã chọn " + lim + " phút (cho phép lệch ±" + SOFT + " phút).", "tong_gio_hoc");
  }
  // (7) khoảng cách giữa các bữa
  { const ev = []; const ML = /(ăn sáng|ăn trưa|ăn tối|bữa|ăn nhẹ|ăn phụ|^ăn )/i;
    B.forEach(b => { if(ML.test(b.khoi) || (b.viec || []).some(v => /(ăn nhẹ|bữa phụ|ăn phụ|ăn sáng|ăn tối)/i.test(v))) ev.push({t: b.s, n: b.khoi}); });
    if(school && school.s <= 660 && school.e >= 720 && !ev.some(x => x.t >= 600 && x.t <= 780)) ev.push({t: 675, n: "bữa trưa ở trường (giả định 11h15)"});
    ev.sort((a, b) => a.t - b.t);
    const lim = (ageOf() || 9) <= 6 ? 240 : 300;
    for(let i = 1; i < ev.length; i++){ const gap = ev[i].t - ev[i - 1].t; if(gap > lim) W.push("Từ " + ev[i - 1].n + " đến " + ev[i].n + " cách khoảng " + fmtMin(gap) + " không có gì ăn. Mốc tham khảo: trẻ cần ăn khoảng 3–4 giờ một lần, 7–12 tuổi có thể 4–5 giờ (Viện Dinh dưỡng và Ăn kiêng Hoa Kỳ). Nên thêm bữa phụ nhỏ ở giữa.", "an_xa"); }
  }
  // (1) giờ ngủ
  const bed = [...B].reverse().find(b => BED.test(b.khoi));
  const nd = DAYS[(DAYS.indexOf(d) + 1) % 7], NB = liveBlocks(nd);
  const age = ageOf();
  if(bed && NB.length && age){
    let sleep = NB[0].s + 1440 - bed.s; if(sleep > 1440) sleep -= 1440;
    const need = age <= 12 ? 540 : 480;
    if(sleep < need) W.push("Từ tắt đèn " + bed.bat_dau + " đến dậy " + NB[0].bat_dau + " hôm sau chỉ khoảng " + fmtMin(sleep) + ", dưới mức " + (need / 60) + " giờ cho " + age + " tuổi.", "ngu");
  }
  // (6) tập mạnh sát giờ ngủ
  if(bed){ B.filter(b => b.tai === "cao" && SPORT.test(b.khoi) && bed.s - b.e < 60 && b.e <= bed.s).forEach(b => W.push("\"" + b.khoi + "\" kết thúc chưa tới 1 giờ trước giờ tắt đèn.", "tap_muon")); }
  return W;
}
function allWarnings(){ const o = {}; DAYS.forEach(d => { const w = checkDay(d); if(w.length) o[d] = w; }); return o; }

const pad = n => (n < 10 ? "0" : "") + n;

  const clean = {ten: String(g.ten || "Giai đoạn tạm thời"), ly_do: String(g.ly_do || ""), nguon: String(g.nguon || "bo_me"), tu_ngay: String(g.tu_ngay || todayStr()).slice(0, 10), den_ngay: String(g.den_ngay || "").slice(0, 10), quy_tac_tam: (Array.isArray(g.quy_tac_tam) ? g.quy_tac_tam : []).map(String), noi_long: (Array.isArray(g.noi_long) ? g.noi_long : []).map(String).filter(k => ["tong_gio_hoc","truoc_gio_hoc","van_dong","man_hinh","an_uong"].includes(k))};

  } else if(act === "sua" && G){

function checkPeriodExpiry(){

/* ---------- quỹ thời gian ---------- */
// Nhóm: truong, hoc_them = cố định theo lịch đăng ký; choi_nghi = phần còn lại; bố mẹ nhập: hoc_nha, sinh_hoat, ngu, man_hinh
const GROUPS = [

  {k:"hoc_nha", n:"Học và rèn luyện ở nhà", ex:"Bài cô giao, ôn bài, học theo định hướng bố mẹ, tự luyện đàn, luyện chữ", mode:"input"},
  {k:"sinh_hoat", n:"Ăn uống, vệ sinh, việc cá nhân", ex:"Bữa ăn, tắm, thay đồ, soạn cặp, đọc truyện trước ngủ", mode:"input"},

const COLS = [{k:"wd", n:"Ngày đi học", days:["T2","T3","T4","T5","T6"]}, {k:"we", n:"Cuối tuần", days:["T7","CN"]}];
const SOFT = 30; // Pal được xê dịch ±30 phút
function sleepNeed(){ const a = ageOf() || 9; return a <= 12 ? 540 : 480; }
function defaultBudget(){
  const g = gradeOf() || 3, a = ageOf() || 9, young = a <= 10, need = sleepNeed();
  return {wd: {hoc_nha: g * 10, sinh_hoat: 105, ngu: need + 30, man_hinh: young ? 30 : 60},
          we: {hoc_nha: g * 10, sinh_hoat: 120, ngu: need + 60, man_hinh: young ? 60 : 120}, ok: {}};
}
function validBudget(B){ return B && B.wd && typeof B.wd.hoc_nha === "number" && B.we && typeof B.we.ngu === "number"; }
function getBudget(){
  if(!validBudget(S.budget)) S.budget = defaultBudget();
  if(!S.budget.ok) S.budget.ok = {};
  if(!S.presets || !Object.keys(S.presets).length){ S.presets = {"Bình thường": JSON.parse(JSON.stringify(S.budget))}; S.presetActive = "Bình thường"; }
  return S.budget;
}
// thời gian cố định lấy từ lịch
const MEAL = /(ăn sáng|ăn trưa|ăn tối|bữa|ăn nhẹ|^ăn )/i;
function groupOf(b){
  if(b.nhom && ["truong","hoc_them","hoc_nha","choi_nghi","sinh_hoat","ngu"].includes(b.nhom)) return b.nhom;
  const t = b.khoi + " " + (b.viec || []).join(" ");
  if(BED.test(b.khoi)) return "ngu";
  if(isSchool(b) || /(đi học|về nhà|tan học)/i.test(b.khoi)) return "truong";
  if(/(trung tâm|học thêm|gia sư|lớp bơi|lớp vẽ|lớp đàn|câu lạc bộ|clb|võ|taekwondo|karate|múa|đi học tiếng anh)/i.test(t)) return "hoc_them";
  if(b.tai === "phuc_hoi") return "choi_nghi";
  if(isStudy(b)) return "hoc_nha";
  if(/(ăn|bữa|vệ sinh|tắm|đánh răng|thay đồ|soạn cặp|dậy|nhật ký|đọc sách|đọc truyện)/i.test(t)) return "sinh_hoat";
  if(b.tai === "cao" || b.tai === "vua") return "hoc_nha";
  return "choi_nghi";
}
function fixedDay(d){
  const R = {truong:0, hoc_them:0}; const useActs = (S.activities || []).length > 0;
  liveBlocks(d).forEach(b => { const g = groupOf(b); if(g === "truong" || (g === "hoc_them" && !useActs)) R[g] += Math.max(0, b.e - b.s); });
  if(useActs) S.activities.filter(a => (a.thu || []).includes(d)).forEach(a => { R.hoc_them += actDur(a) + (+a.di_lai || 0); });

}
function actDur(a){ const x = toMin(a.bat_dau), y = toMin(a.ket_thuc); return x !== null && y !== null && y > x ? y - x : 0; }
function actualDay(d){
  const R = {truong:0, hoc_them:0, hoc_nha:0, choi_nghi:0, man_hinh:0, sinh_hoat:0, ngu:0};
  const B = liveBlocks(d); if(!B.length) return null;
  let last = null;
  B.forEach(b => {
    const g = groupOf(b), dur = Math.max(0, b.e - b.s);

    if(b.man_hinh || /(tivi|ti vi|điện thoại|game|màn hình|ipad)/i.test(b.khoi)) R.man_hinh += dur;
    if(last !== null && b.s > last && g !== "ngu") R.choi_nghi += b.s - last;
    last = Math.max(last || 0, b.e);
  });
  const bed = [...B].reverse().find(b => BED.test(b.khoi));
  const nb = liveBlocks(DAYS[(DAYS.indexOf(d) + 1) % 7]);
  if(bed && nb.length){ let sl = nb[0].s + 1440 - bed.s; if(sl > 1440) sl -= 1440; R.ngu = sl; }

}
function rangeOf(col, fn, key){
  const xs = COLS.find(c => c.k === col).days.map(fn).filter(Boolean).map(v => v[key]);
  return xs.length ? [Math.min(...xs), Math.max(...xs)] : null;
}
const hm = m => { m = Math.round(m); const neg = m < 0; m = Math.abs(m); const h = Math.floor(m / 60), r = m % 60; return (neg ? "−" : "") + (h ? h + "h" + (r ? pad(r) : "") : r + "′"); };
const hmR = ([a, b]) => a === b ? hm(a) : hm(a) + "–" + hm(b);
// phần còn lại = 24h − cố định − các ô bố mẹ nhập (ăn uống tính một nửa vào nghỉ)
function restRange(col){
  const B = getBudget()[col], days = COLS.find(c => c.k === col).days;
  const vals = days.map(d => { const f = fixedDay(d); return 1440 - f.truong - f.hoc_them - B.hoc_nha - B.sinh_hoat - B.ngu + Math.round(B.sinh_hoat * 0.25); });
  return [Math.min(...vals), Math.max(...vals)];

// màu so với khuyến nghị (bản nháp, đặc tả mục 2.1)
function judge(gk, col, v){
  const g = gradeOf() || 3, wd = col === "wd", need = sleepNeed();
  const up = (x, base, why) => x <= base ? ["xanh", ""] : x <= base * 1.5 ? ["cam", why] : ["do", why];
  const lo = (x, ok, warn, why) => x >= ok ? ["xanh", ""] : x >= warn ? ["cam", why] : ["do", why];
  switch(gk){
    case "ngu": { const a = ageOf(); const rng = (a || 9) <= 12 ? "9–12 giờ cho trẻ 6–12 tuổi" : "8–10 giờ cho trẻ 13–18 tuổi";
      return lo(v, need, need - 30, "Ngủ " + hm(v) + ", thấp hơn mức tối thiểu " + hm(need) + ". Mốc tham khảo: " + rng + " (Viện Hàn lâm Y học Giấc ngủ Hoa Kỳ, AASM). Thiếu ngủ kéo dài làm giảm tập trung và tâm trạng."); }
    case "hoc_nha": return ["xam", ""]; // bố mẹ tự quản lý; ảnh hưởng thể hiện qua ô chơi và nghỉ, giấc ngủ
    case "man_hinh": return v <= 60 ? ["xanh", ""] : v <= 120
      ? ["cam", "Màn hình giải trí " + hm(v) + ", trên 1 giờ. Mốc 1 giờ là mặc định của Pal cho trẻ nhỏ, để còn chỗ cho vận động và tắt màn hình trước giờ ngủ 60 phút (chưa phải chuẩn y khoa)."]
      : ["do", "Màn hình giải trí " + hm(v) + ", vượt mốc tối đa 2 giờ/ngày cho trẻ 5–17 tuổi (Hướng dẫn vận động 24 giờ của Canada)."];
    case "sinh_hoat": return lo(v, 90, 60, "Ăn uống, vệ sinh còn " + hm(v) + ". Mốc tham khảo khoảng 1h30 ở nhà: sáng 30′ (vệ sinh, ăn sáng), tối 30′ (ăn tối), 30′ tắm và vệ sinh trước ngủ. Thiếu thì con dễ phải ăn vội, bị giục. (Ước tính của Pal, chưa phải chuẩn.)");
    case "choi_nghi": return v < 0 ? ["do", "Các nhóm cộng lại vượt 24 giờ khoảng " + hm(-v) + ". Cần giảm giờ học ở nhà, sinh hoạt hoặc ngủ cho đủ một ngày."]
      : lo(v, wd ? 60 : 120, wd ? 30 : 60, "Chơi và nghỉ chỉ còn " + hm(v) + ". Mốc tham khảo " + (wd ? "ngày đi học ít nhất 1 giờ: 20–30′ phục hồi sau giờ học và khoảng 30′ tự do buổi tối" : "cuối tuần ít nhất 2 giờ chơi tự do") + "; WHO khuyến nghị trẻ 5–17 tuổi vận động trung bình 60′/ngày, phần ngoài giờ trường nằm trong ô này.");
    case "hoc_them": return v <= (wd ? 120 : 180) ? ["xanh", ""] : ["" + (v <= (wd ? 180 : 270) ? "cam" : "do"), "Học thêm " + hm(v) + (wd ? ", trên 2 giờ sau 6–7 giờ ở trường" : ", trên 3 giờ trong ngày nghỉ") + ", làm hẹp thời gian phục hồi và chơi tự do. (Mốc mặc định của Pal, chưa phải chuẩn.)"];
    default: return ["xam", ""];
  }
}
function budgetForPrompt(){

  return {don_vi: "phút/ngày", xe_dich_toi_da: SOFT, preset: S.presetActive || "", ngay_di_hoc: Object.assign({}, B.wd, {choi_nghi_con_lai: restRange("wd")}, {co_dinh: fx("wd")}),
          cuoi_tuan: Object.assign({}, B.we, {choi_nghi_con_lai: restRange("we")}, {co_dinh: fx("we")}), da_xac_nhan_vung_do: Object.keys(B.ok || {})};

function presetDirty(){ const P = S.presets && S.presets[S.presetActive]; if(!P) return true; const strip = x => JSON.stringify({wd: x.wd, we: x.we}); return strip(P) !== strip(getBudget()); }
function renderBudget(){
  const w = $("budgetWrap"); if(!w) return; w.innerHTML = "";
  const B = getBudget();
  // menu preset
  const pc = document.createElement("div"); pc.className = "card";
  pc.innerHTML = '<h2>⏱️ Quỹ thời gian một ngày của con</h2><div class="muted">Bố mẹ nhập số giờ cho các ô trắng. Ở trường và học thêm lấy theo lịch; chơi tự do là phần còn lại. Pal xếp lịch theo quỹ, xê dịch tối đa ±30 phút.</div>';
  const pr = document.createElement("div"); pr.className = "presetbar";
  const sel = document.createElement("select");
  Object.keys(S.presets).forEach(n => { const o = document.createElement("option"); o.value = n; o.textContent = n; if(n === S.presetActive) o.selected = true; sel.appendChild(o); });
  sel.onchange = () => { S.presetActive = sel.value; S.budget = JSON.parse(JSON.stringify(S.presets[sel.value])); if(!S.budget.ok) S.budget.ok = {}; renderBudget(); save(); toast("Đã chuyển sang \"" + sel.value + "\"."); };
  pr.appendChild(sel);
  const mk = (t, f, cls) => { const x = document.createElement("button"); x.textContent = t; if(cls) x.className = cls; x.onclick = f; pr.appendChild(x); return x; };
  const dirty = presetDirty();
  mk(dirty ? "💾 Lưu •" : "💾 Lưu", () => { S.presets[S.presetActive] = JSON.parse(JSON.stringify(getBudget())); renderBudget(); save(); toast("Đã lưu \"" + S.presetActive + "\"."); }, dirty ? "pri" : "");
  mk("＋ Lưu thành mới", () => {
    const box = document.createElement("div"); box.className = "newp";
    const inp = document.createElement("input"); inp.placeholder = "Tên, ví dụ: Thi cử, Nghỉ hè";
    const ok = document.createElement("button"); ok.className = "pri"; ok.textContent = "Lưu";
    ok.onclick = () => { const n = inp.value.trim(); if(!n) return; S.presets[n] = JSON.parse(JSON.stringify(getBudget())); S.presetActive = n; renderBudget(); save(); toast("Đã lưu preset \"" + n + "\"."); };
    box.appendChild(inp); box.appendChild(ok);
    ["Thi cử","Nghỉ hè","Nghỉ lễ"].filter(n => !S.presets[n]).forEach(n => { const c = document.createElement("button"); c.textContent = n; c.onclick = () => { inp.value = n; }; box.appendChild(c); });
    pc.appendChild(box); inp.focus();
  });
  if(Object.keys(S.presets).length > 1) mk("🗑", () => { delete S.presets[S.presetActive]; S.presetActive = Object.keys(S.presets)[0]; S.budget = JSON.parse(JSON.stringify(S.presets[S.presetActive])); renderBudget(); save(); });
  pc.appendChild(pr);
  w.appendChild(pc);
  // bảng
  const card = document.createElement("div"); card.className = "card";
  GROUPS.forEach(g => {
    const row = document.createElement("div"); row.className = "brow" + (g.sub ? " sub" : "");
    row.innerHTML = '<div class="gname">' + esc(g.n) + '</div><div class="gex">' + esc(g.ex) + "</div>";
    const grid = document.createElement("div"); grid.className = "bgrid"; row.appendChild(grid);
    COLS.forEach(c => {
      const cell = document.createElement("div"); cell.innerHTML = '<div class="clab">' + c.n + "</div>";
      let col = "xam", why = "", val = null;
      if(g.mode === "fixed"){
        const r = rangeOf(c.k, fixedDay, g.k);
        val = r ? r[1] : 0; [col, why] = g.k === "hoc_them" ? judge(g.k, c.k, val) : ["xam", ""];
        cell.innerHTML += '<div class="fx"><span class="cdot c-' + col + '"></span>' + (r ? hmR(r) : "—") + '</div><div class="act">' + (g.k === "truong" ? "theo thời khóa biểu" : "theo danh sách hoạt động") + "</div>";
      } else if(g.mode === "rest"){
        const r = restRange(c.k); [col, why] = judge("choi_nghi", c.k, r[0]);
        cell.innerHTML += '<div class="fx"><span class="cdot c-' + col + '"></span>' + hmR(r) + '</div><div class="act">tự tính, phần còn lại</div>';
      } else {
        val = B[c.k][g.k]; [col, why] = judge(g.k, c.k, val);
        const box = document.createElement("div"); box.className = "rng";
        box.innerHTML = '<span class="cdot c-' + col + '"></span>';
        const inp = document.createElement("input"); inp.type = "number"; inp.inputMode = "decimal"; inp.step = "0.25"; inp.min = "0"; inp.max = "14";
        inp.value = String(Math.round(val / 15) / 4);
        inp.onchange = () => setBudget(c.k, g.k, parseFloat(String(inp.value).replace(",", ".")));
        box.appendChild(inp); const u = document.createElement("span"); u.className = "muted"; u.textContent = "giờ"; box.appendChild(u);
        cell.appendChild(box);
      }
      if(why){
        const key = c.k + "." + g.k, okd = B.ok[key];
        const wl = document.createElement("div"); wl.className = "wline " + col + (okd ? " okd" : "");
        wl.textContent = (col === "do" ? "⛔ " : "⚠️ ") + why + (okd ? " · bố mẹ đã xác nhận" : "");
        if(col === "do" && !okd && g.mode === "input"){ const k = document.createElement("button"); k.textContent = "Giữ mức này"; k.onclick = () => { B.ok[key] = true; renderBudget(); save(); }; wl.appendChild(k); }
        cell.appendChild(wl);
      }
      grid.appendChild(cell);
    });
    card.appendChild(row);
  });
  const lg = document.createElement("div"); lg.className = "legend";
  lg.innerHTML = '<span class="cdot c-xanh"></span>cân bằng <span class="cdot c-cam" style="margin-left:8px"></span>hơi lệch <span class="cdot c-do" style="margin-left:8px"></span>lệch nhiều · Học ở nhà do bố mẹ quyết định, không chấm màu; nếu quá nhiều sẽ thấy ở ô chơi và nghỉ hoặc giấc ngủ. Mỗi cảnh báo ghi mốc và nguồn; mốc ghi “mặc định của Pal” là chưa kiểm chứng.';
  card.appendChild(lg);
  const row = document.createElement("div"); row.className = "prow";
  const b1 = document.createElement("button"); b1.className = "pri"; b1.textContent = "Nhờ Pal xếp lịch theo quỹ này"; b1.onclick = () => { navChat(); send("Hãy xếp lại lịch cả tuần cho khớp với quỹ thời gian \"" + (S.presetActive || "") + "\" bố mẹ vừa chốt."); };
  const b2 = document.createElement("button"); b2.textContent = "Về mặc định theo tuổi"; b2.onclick = () => { S.budget = defaultBudget(); renderBudget(); save(); };
  row.appendChild(b1); row.appendChild(b2); card.appendChild(row);
  w.appendChild(card);
  // đề xuất của con
  const P = (S.proposals || []).filter(p => !p.xong);
  if(P.length){
    const qc = document.createElement("div"); qc.className = "card"; qc.innerHTML = "<h2>💬 Con đề xuất và báo</h2>";
    P.forEach(p => {
      const d = document.createElement("div"); d.className = "prop"; d.innerHTML = "<div>" + esc(p.text) + '</div><div class="muted">' + esc(p.ngay) + "</div>";
      const r = document.createElement("div"); r.className = "prow";
      const a = document.createElement("button"); a.className = "pri"; a.textContent = "Nhờ Pal xem đề xuất"; a.onclick = () => { p.xong = true; save(); navChat(); send(p.loai === "doi" ? p.text + ". Hãy xem khoảng cách các bữa quanh giờ đó và đề xuất bữa phụ nếu cần." : "Con đề xuất: \"" + p.text + "\". Bố mẹ muốn xem xét. Hãy cho biết ảnh hưởng tới quỹ thời gian và đưa phương án."); };
      const x = document.createElement("button"); x.textContent = "Để sau"; x.onclick = () => { p.xong = true; renderBudget(); save(); };
      r.appendChild(a); r.appendChild(x); d.appendChild(r); qc.appendChild(d);
    });
    w.appendChild(qc);
  }
}
function setBudget(col, gk, hours){
  if(!isFinite(hours) || hours < 0){ renderBudget(); return; }
  const B = getBudget(); B[col][gk] = Math.round(hours * 60 / 5) * 5;
  if(judge(gk, col, B[col][gk])[0] !== "do") delete B.ok[col + "." + gk];
  renderBudget(); save();
}

/* ---------- hoạt động cố định của con ---------- */
const LOAI = {hoc_them: "Học thêm", the_thao: "Tập luyện", nang_khieu: "Năng khiếu", khac: "Khác"};
const hhmm = t => { const m = toMin(t); return m === null ? "" : pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
function cleanAct(a, base){
  const o = Object.assign({}, base || {});
  ["ten","dia_diem","ghi_chu"].forEach(k => { if(a[k] !== undefined) o[k] = String(a[k] || "").trim(); });
  if(a.loai !== undefined) o.loai = LOAI[a.loai] ? a.loai : "khac";
  if(Array.isArray(a.thu)) o.thu = DAYS.filter(d => a.thu.includes(d));
  ["bat_dau","ket_thuc"].forEach(k => { if(a[k] !== undefined) o[k] = hhmm(a[k]); });
  if(a.di_lai !== undefined) o.di_lai = Math.max(0, Math.round(+a.di_lai || 0));
  if(!o.loai) o.loai = "hoc_them"; if(!o.thu) o.thu = []; if(!o.ten) o.ten = "Hoạt động";
  return o;
}
function applyActs(list){
  S.activities = S.activities || []; S.actNew = S.actNew || []; let n = 0;
  list.forEach((a, i) => {
    if(!a || typeof a !== "object") return;
    const find = () => S.activities.findIndex(x => x.id === a.id || (!a.id && a.ten && x.ten.toLowerCase() === String(a.ten).toLowerCase()));
    if(a.hanh_dong === "xoa"){ const k = find(); if(k >= 0){ S.activities.splice(k, 1); n++; } return; }
    if(a.hanh_dong === "sua"){ const k = find(); if(k >= 0){ S.activities[k] = cleanAct(a, S.activities[k]); S.actNew.push(S.activities[k].id); n++; return; } }
    const o = cleanAct(a); o.id = "a" + Date.now().toString(36) + i; o.nguon = "pal";
    S.activities.push(o); S.actNew.push(o.id); n++;
  });
  return n;
}
let actEdit = null; // id đang sửa, hoặc "new"
function actForm(a, onDone){
  const f = document.createElement("div"); f.className = "aform";
  const ten = document.createElement("input"); ten.placeholder = "Tên, ví dụ: Tiếng Anh, Bơi, Piano"; ten.value = a.ten || "";
  const loai = document.createElement("select"); Object.keys(LOAI).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = LOAI[k]; if(k === (a.loai || "hoc_them")) o.selected = true; loai.appendChild(o); });
  const r1 = document.createElement("div"); r1.className = "r2"; r1.appendChild(ten); r1.appendChild(loai);
  const thu = new Set(a.thu || []);
  const dp = document.createElement("div"); dp.className = "dpk";
  DAYS.forEach(d => { const b = document.createElement("button"); b.textContent = d; b.className = thu.has(d) ? "on" : ""; b.onclick = () => { thu.has(d) ? thu.delete(d) : thu.add(d); b.className = thu.has(d) ? "on" : ""; }; dp.appendChild(b); });
  const t1 = document.createElement("input"); t1.type = "time"; t1.value = a.bat_dau || "";
  const t2 = document.createElement("input"); t2.type = "time"; t2.value = a.ket_thuc || "";
  const r2 = document.createElement("div"); r2.className = "r2"; r2.appendChild(t1); r2.appendChild(t2);
  const dl = document.createElement("input"); dl.type = "number"; dl.min = "0"; dl.step = "5"; dl.placeholder = "Đi lại (phút, cả đi và về)"; if(a.di_lai) dl.value = a.di_lai;
  const dd = document.createElement("input"); dd.placeholder = "Địa điểm (không bắt buộc)"; dd.value = a.dia_diem || "";
  const r3 = document.createElement("div"); r3.className = "r2"; r3.appendChild(dl); r3.appendChild(dd);
  const gc = document.createElement("input"); gc.placeholder = "Ghi chú (mang gì, ai đưa đón…)"; gc.value = a.ghi_chu || "";
  const row = document.createElement("div"); row.className = "row";
  const no = document.createElement("button"); no.textContent = "Thôi"; no.onclick = () => { actEdit = null; renderActs(); };
  const ok = document.createElement("button"); ok.className = "pri"; ok.textContent = "Lưu";
  ok.onclick = () => {
    if(!ten.value.trim() || !thu.size || !t1.value || !t2.value || toMin(t2.value) <= toMin(t1.value)){ toast("Cần tên, ít nhất một ngày, giờ bắt đầu và kết thúc hợp lệ."); return; }
    onDone(cleanAct({ten: ten.value, loai: loai.value, thu: [...thu], bat_dau: t1.value, ket_thuc: t2.value, di_lai: dl.value, dia_diem: dd.value, ghi_chu: gc.value}, a));
  };
  row.appendChild(no); row.appendChild(ok);
  [r1, dp, r2, r3, gc, row].forEach(x => f.appendChild(x));
  return f;
}
function renderActs(){
  const w = $("actWrap"); if(!w) return; w.innerHTML = "";
  const A = (S.activities || []).slice().sort((x, y) => (DAYS.indexOf((x.thu || [])[0]) - DAYS.indexOf((y.thu || [])[0])) || ((toMin(x.bat_dau) || 0) - (toMin(y.bat_dau) || 0)));
  const c = document.createElement("div"); c.className = "card acts";
  c.innerHTML = '<h2>🧩 Hoạt động của con</h2><div class="muted">Lớp học thêm, tập luyện, năng khiếu cố định hằng tuần. Pal ghi lại khi bố mẹ kể trong trò chuyện; bố mẹ sửa trực tiếp ở đây.</div>';
  const wk = document.createElement("div"); wk.className = "aweek";
  DAYS.forEach(d => { const n = A.filter(a => a.thu.includes(d)); const x = document.createElement("div"); x.className = n.length ? "on" : ""; x.title = n.map(a => a.ten).join(", "); x.textContent = d + (n.length ? " · " + n.length : ""); wk.appendChild(x); });
  c.appendChild(wk);
  if(S.actDirty && Object.keys(S.plan.ngay || {}).length){
    const dz = document.createElement("div"); dz.className = "adirty"; dz.textContent = "Lịch tuần chưa cập nhật theo thay đổi vừa sửa.";
    const b = document.createElement("button"); b.textContent = "Nhờ Pal cập nhật lịch"; b.onclick = () => { navChat(); send("Bố mẹ vừa sửa danh sách hoạt động của con. Hãy xếp lại các ngày bị ảnh hưởng cho khớp."); };
    dz.appendChild(b); c.appendChild(dz);
  }
  if(!A.length && actEdit !== "new"){
    const e = document.createElement("div"); e.className = "muted"; e.style.margin = "4px 0 8px";
    e.textContent = "Chưa có hoạt động nào. Kể cho Pal ở khung trò chuyện, ví dụ: “Con học tiếng Anh thứ 4 và thứ 6, 17h đến 18h30”.";
    c.appendChild(e);
  }
  const markDirty = () => { S.actDirty = true; actEdit = null; renderActs(); renderBudget(); save(); };
  A.forEach(a => {
    const it = document.createElement("div"); it.className = "aitem" + ((S.actNew || []).includes(a.id) ? " new" : "");
    if(actEdit === a.id){
      it.appendChild(actForm(a, o => { Object.assign(a, o); markDirty(); toast("Đã lưu \"" + a.ten + "\"."); }));
    } else {
      const d = actDur(a);
      it.innerHTML = '<div class="at">' + esc(a.ten) + ' <span class="lb">' + esc(LOAI[a.loai] || "Khác") + "</span>" + ((S.actNew || []).includes(a.id) ? '<span class="nw">● Pal vừa ghi</span>' : "") + "</div>"
        + '<div class="ad">' + a.thu.map(x => "<span>" + x + "</span>").join("") + "<span>" + esc(a.bat_dau) + "–" + esc(a.ket_thuc) + (d ? " · " + hm(d) : "") + "</span></div>"
        + '<div class="am">' + [a.di_lai ? "đi lại " + hm(a.di_lai) : "", a.dia_diem ? "📍 " + esc(a.dia_diem) : "", a.ghi_chu ? esc(a.ghi_chu) : ""].filter(Boolean).join(" · ") + "</div>";
      const ab = document.createElement("div"); ab.className = "ab";
      const e1 = document.createElement("button"); e1.textContent = "✏️ Sửa"; e1.onclick = () => { actEdit = a.id; renderActs(); };
      const e2 = document.createElement("button"); e2.textContent = "🗑 Xóa"; e2.onclick = () => { S.activities = S.activities.filter(x => x.id !== a.id); markDirty(); toast("Đã xóa \"" + a.ten + "\"."); };
      ab.appendChild(e1); ab.appendChild(e2); it.appendChild(ab);
    }
    c.appendChild(it);
  });
  if(actEdit === "new"){
    const it = document.createElement("div"); it.className = "aitem new";
    it.appendChild(actForm({}, o => { o.id = "a" + Date.now().toString(36); o.nguon = "bo_me"; S.activities = S.activities || []; S.activities.push(o); markDirty(); toast("Đã thêm \"" + o.ten + "\"."); }));
    c.appendChild(it);
  } else {
    const add = document.createElement("button"); add.className = "addb"; add.textContent = "＋ Thêm hoạt động"; add.onclick = () => { actEdit = "new"; renderActs(); };
    c.appendChild(add);
  }
  if(A.length){
    const tot = A.reduce((n, a) => n + (actDur(a) + (+a.di_lai || 0)) * a.thu.length, 0);
    const t = document.createElement("div"); t.className = "muted"; t.style.marginTop = "8px"; t.textContent = "Tổng mỗi tuần khoảng " + hm(tot) + " (kể cả đi lại). Giờ này tự vào ô Học thêm của quỹ thời gian.";
    c.appendChild(t);
  }
  w.appendChild(c);
}

/* ---------- hôm nay của con ---------- */
function todayKey(){ return DAYS[(new Date().getDay() + 6) % 7]; }
const blockKey = b => (b.bat_dau || "") + "|" + (b.khoi || "");
function todayLog(){ const k = todayStr(); S.log = S.log || {}; if(!S.log[k]) S.log[k] = {k:{}, met:""}; return S.log[k]; }
function nowMin(){ const t = new Date(); return t.getHours() * 60 + t.getMinutes(); }
function kindOf(x){ x = (x || "").toLowerCase(); if(/ảnh|chụp/.test(x)) return "anh"; if(/giọng|kể|nói/.test(x)) return "noi"; if(/tự động|vùng|buổi tập/.test(x)) return "tu"; if(/bố mẹ|phụ huynh/.test(x)) return "bm"; if(/không cần/.test(x) || !x) return "khong"; return "bam"; }
let kidTarget = null;
const WX = {nang: {n: "☀️ Nắng nóng", d: ["Mũ", "Bình nước đầy"]}, mua: {n: "🌧 Mưa", d: ["Áo mưa hoặc ô", "Túi ni lông bọc sách"]}, lanh: {n: "🧥 Lạnh", d: ["Áo khoác", "Khăn quàng"]}, thuong: {n: "🌤 Bình thường", d: []}};
const dateAdd = (n) => { const t = new Date(Date.now() + n * 864e5); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()); };
function wxForPrompt(){ const o = {}; Object.keys(S.wx || {}).filter(k => k >= todayStr()).forEach(k => { o[k] = WX[S.wx[k]] ? WX[S.wx[k]].n.replace(/^\S+ /, "") : S.wx[k]; }); return o; }
function hungerForPrompt(){ const L = S.log || {}; return Object.keys(L).filter(k => k >= dateAdd(-14) && (L[k].doi || []).length).map(k => k + ": " + L[k].doi.join(", ")); }

function renderToday(){
  const w = $("todayWrap"); if(!w) return; w.innerHTML = "";
  const d = todayKey(), L = todayLog();
  const blocks = (S.plan.ngoai_le[d] ? S.plan.ngoai_le[d].khoi : (S.plan.ngay[d] || [])).filter(b => b.trang_thai !== "huy");
  const top = document.createElement("div"); top.className = "card kid";
  const checkable = blocks.filter(b => kindOf(b.xac_nhan) !== "khong");
  const done = checkable.filter(b => L.k[blockKey(b)] && L.k[blockKey(b)].xong).length;
  top.innerHTML = "<h2>Chào con! Hôm nay " + DAY_NAME[d] + "</h2>" + (checkable.length ? '<div class="prog"><i style="width:' + Math.round(done / checkable.length * 100) + '%"></i></div><div class="muted">Đã xong ' + done + "/" + checkable.length + " việc</div>" : '<div class="muted">Hôm nay chưa có lịch. Nhờ bố mẹ lập lịch với Pal nhé.</div>');
  const hb = document.createElement("div"); hb.className = "kbtns"; hb.style.marginTop = "8px";
  const hx = document.createElement("button"); hx.textContent = "🍎 Con thấy đói";
  hx.onclick = () => {
    const now = pad(new Date().getHours()) + ":" + pad(new Date().getMinutes()), nm0 = nowMin();
    L.doi = L.doi || []; L.doi.push(now);
    const meals = blocks.filter(b => /(ăn|bữa)/i.test(b.khoi + " " + (b.viec || []).join(" ")));
    const prev = meals.filter(b => toMin(b.bat_dau) <= nm0).pop(), next = meals.find(b => toMin(b.bat_dau) > nm0);

    rec.onerror = ev => { recOn = false; $("micBtn").classList.remove("rec"); if(ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture"){ micBlocked = true; $("input").focus(); toast("Trang này không được dùng micro trực tiếp. Hãy bấm 🎤 trên bàn phím điện thoại để nói.", 5000); } };
    rec.onend = () => { recOn = false; $("micBtn").classList.remove("rec"); const t = $("input").value.trim(); if(finalT && t) send(t); };
    rec.start(); recOn = true; $("micBtn").classList.add("rec");
  }catch(e){ micBlocked = true; $("input").focus(); toast("Bấm biểu tượng 🎤 trên bàn phím điện thoại để nói tiếng Việt.", 4500); }
};

/* ---------- images ---------- */
let pending = [];
$("attBtn").onclick = () => $("fileIn").click();
$("fileIn").onchange = async () => {
  const files = Array.from($("fileIn").files || []).slice(0, 4 - pending.length);
  for(const f of files){ try{ pending.push(await shrink(f)); }catch(e){ toast("Không đọc được ảnh này."); } }
  $("fileIn").value = ""; renderPreview();
};
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({blob: b, url: URL.createObjectURL(b)}) : rej(), "image/jpeg", 0.85);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}
function renderPreview(){
  const p = $("preview"); p.innerHTML = ""; p.style.display = pending.length ? "flex" : "none";
  pending.forEach((x, i) => { const d = document.createElement("div"); d.className = "th"; d.innerHTML = '<img src="' + x.url + '">'; const b = document.createElement("button"); b.textContent = "✕"; b.onclick = () => { pending.splice(i, 1); renderPreview(); }; d.appendChild(b); p.appendChild(d); });
}

/* ---------- reset ---------- */
$("resetBtn").onclick = () => { if(busy){ toast("Đợi Pal trả lời xong rồi làm lại nhé."); return; } $("dlgText").textContent = "Chọn phần muốn xóa. Bộ đếm token cũng về 0."; $("dlg").style.display = "flex"; };
$("dlgNo").onclick = () => $("dlg").style.display = "none";
function doReset(keepProfile, keepChat){
  const prof = S.profile, msgs = S.messages, bud = S.budget, pre = S.presets, pa = S.presetActive;
  const acts = S.activities;
  S = blank(); if(keepProfile){ S.profile = prof; S.budget = bud; S.presets = pre; S.presetActive = pa; S.activities = acts || []; } if(keepChat) S.messages = msgs;
  curDay = "T2"; showTemplate = false; pending = []; renderPreview();
  $("dlg").style.display = "none"; try{ speechSynthesis.cancel(); }catch(e){}
  renderAll(); save(); toast(keepProfile ? "Đã làm lại, vẫn giữ hồ sơ của con." : "Đã xóa hết, bắt đầu từ đầu.");
}
$("dlgYes").onclick = () => doReset(false, false);
$("dlgKeep").onclick = () => doReset(true, false);
$("dlgPlan").onclick = () => doReset(true, true);

loadLocal(); checkPeriodExpiry(); renderAll(); initCaps();
})();
</script>
