name: Rà soát thiết kế L4

on:
  pull_request:
    paths:
      - 'tools/l4/**'
      - '.github/workflows/l4-design-review.yml'
      - 'documents/app-design-document/**'
  workflow_dispatch:
    inputs:
      module:
        description: 'Mã L3, ví dụ F01-G04-M01'
        required: true
        type: string
      mode:
        description: 'Chế độ thực thi'
        type: choice
        options:
          - mock
          - openai
        default: mock
      publish_draft:
        description: 'Tạo Draft PR chứa báo cáo (chế độ openai)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  review:
    if: github.event_name == 'pull_request' || inputs.mode == 'mock' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: tools/l4
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: sources
        name: Xác định snapshot pilot
        run: |
          python3 -c 'import json; print("commit=" + json.load(open("tools/l4/sources.json"))["pilot_commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sources.outputs.commit }}
          path: .pilot-snapshot
          persist-credentials: false
          sparse-checkout: documents/app-design-document
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/l4/requirements.txt
      - run: python -m pip install -r tools/l4/requirements.txt
      - name: Kiểm thử hệ thống và ba bộ nguồn pilot
        env:
          L4_CANONICAL_ROOT: .
          L4_PILOT_ROOT: .pilot-snapshot
        run: python -m unittest discover -s tools/l4/tests -v
      - name: Chạy ba module bằng mock trong CI
        if: github.event_name == 'pull_request'
        run: |
          python -m l4_system --mode mock --repo . --pilot-root .pilot-snapshot \
            --module F01-G04-M01 F06-G07-M01 F04-G02-M03 --out .l4-runs
      - name: Chạy module được chọn bằng mock
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mock'
        env:
          MODULE: ${{ inputs.module }}
        run: python -m l4_system --mode mock --repo . --pilot-root .pilot-snapshot --module "$MODULE" --out .l4-runs
      - name: Chạy các agent OpenAI
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'openai' && github.ref == 'refs/heads/main'
        env:
          MODULE: ${{ inputs.module }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m l4_system --mode openai --repo . --pilot-root .pilot-snapshot --module "$MODULE" --out .l4-runs
      - name: Lưu hồ sơ thực thi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: .l4-runs/
          include-hidden-files: true
          retention-days: 14
      - name: Lưu riêng báo cáo để tạo Draft PR
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'openai' && inputs.publish_draft
        uses: actions/upload-artifact@v4
        with:
          name: l4-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .l4-runs/*/report.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'openai' && inputs.publish_draft
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: l4-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/l4-report
      - name: Tạo nhánh báo cáo và Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ inputs.module }}
          REPORT_DIR: ${{ runner.temp }}/l4-report
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODULE" =~ ^F[0-9]{2}-G[0-9]{2}-M[0-9]{2}$ ]]
          mapfile -t reports < <(find "$REPORT_DIR" -type f -name report.md)
          [[ "${#reports[@]}" -eq 1 ]]
          run="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          branch="l4-review/${MODULE,,}-$run"
          target="tools/l4/reviews/$MODULE/$run.md"
          mkdir -p "$(dirname "$target")"
          cp -- "${reports[0]}" "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          [[ "$(git diff --cached --name-only)" == "$target" ]]
          git commit -m "Thêm báo cáo thiết kế L4 $MODULE"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "Rà soát thiết kế L4 $MODULE" \
            --body "Báo cáo ứng viên: $target. Xem lịch sử tại $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Có kiểm tra cấu trúc và test thiết kế; chưa thực thi test ứng dụng. Các quyết định, bất đồng và yêu cầu nghiên cứu nằm trong báo cáo."

