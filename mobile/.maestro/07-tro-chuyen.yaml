# Trò chuyện với Pal giả lập: ví dụ lớp 3 tạo hồ sơ, hoạt động, lịch tuần; rồi hủy ngày ốm.
appId: vn.parentpal.app
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Dùng ví dụ học sinh lớp 3"
- tapOn: "Dùng ví dụ học sinh lớp 3"
- extendedWaitUntil:
    visible: "Mình đã ghi hồ sơ và lập lịch.*"
    timeout: 15000
- scrollUntilVisible:
    element: "Tiếng Anh"
- tapOn: "Lịch tuần"
- assertVisible: "8 tuổi, lớp 3"
- tapOn: "T2"
- assertVisible: "Học ở trường.*"
- tapOn: "Lên kế hoạch"
- scrollUntilVisible:
    element: "Thứ Năm tuần này con bị ốm, hủy toàn bộ lịch"
- tapOn: "Thứ Năm tuần này con bị ốm, hủy toàn bộ lịch"
- extendedWaitUntil:
    visible: "Mình đã hủy lịch hôm đó.*"
    timeout: 15000
- tapOn: "Lịch tuần"
- tapOn: "T5"
- assertVisible: "Chỉ áp dụng tuần này: Con bị ốm"
- assertVisible: "Hủy"
